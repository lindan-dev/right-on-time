<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veckoplanen">
<meta name="theme-color" content="#F5F7F5">
<title>Veckoplanen</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#1D9E75;--green-light:#E1F5EE;--green-dark:#085041;--bg:#F5F7F5;--card:#fff;--border:#E8EDE9;--text:#1A2B1E;--text-secondary:#6B7F70;--text-tertiary:#A0AFA3;--radius:16px;--radius-sm:10px;--col-olle:#E1F5EE;--col-olle-border:#9FE1CB;--col-alvar:#EEF4FF;--col-alvar-border:#B8CFFE;--col-nils:#FFF4EE;--col-nils-border:#FECBA8;--col-pappa:#F5F0FF;--col-pappa-border:#D4B8FE;--col-ovrigt:#FFFBEE;--col-ovrigt-border:#FEEAB8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text)}
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{flex-shrink:0;background:var(--card);border-bottom:1.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar-title{font-size:18px;font-weight:800;color:var(--text)}
.topbar-week{font-size:13px;font-weight:600;color:var(--text-secondary)}
.topbar-right{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.green{background:var(--green-light);border-color:var(--col-olle-border)}
.icon-btn.gcal{background:#EEF4FF;border-color:#B8CFFE;font-size:16px}
.icon-btn.gcal.connected{background:#E1F5EE;border-color:#9FE1CB}
.syncing{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view-toggle{display:none}
.vt-btn{flex:1;padding:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;font-size:13px;font-weight:700;color:var(--text-secondary);cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s}
.vt-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
.week-nav{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}
.week-nav-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.week-nav-label{font-size:14px;font-weight:700;color:var(--text)}
.scroll-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll-body::-webkit-scrollbar{display:none}
.cal-wrap{overflow-x:auto}
.cal-table{width:100%;border-collapse:collapse;min-width:520px}
.cal-head{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:2px solid var(--border)}
.cal-head th{padding:8px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);text-align:left;border-right:1px solid var(--border)}
.cal-head th:first-child{width:68px;min-width:68px}
.col-olle-head{color:var(--green-dark)!important;background:var(--col-olle)}
.col-alvar-head{color:#1E3A8A!important;background:var(--col-alvar)}
.col-nils-head{color:#92400E!important;background:var(--col-nils)}
.col-pappa-head{color:#4C1D95!important;background:var(--col-pappa)}
.col-ovrigt-head{color:#78350F!important;background:var(--col-ovrigt)}
.cal-row{border-bottom:1px solid var(--border)}
.cal-row.today .day-label-cell,.cal-row.today .day-cell{background:#FFFDF0}
.day-cell{padding:6px 5px;vertical-align:top;border-right:1px solid var(--border);min-height:52px;min-width:80px}
.day-label-cell{width:68px;min-width:68px;padding:8px 6px;vertical-align:top;border-right:2px solid var(--border);background:var(--card)}
.day-number{font-size:18px;font-weight:800;color:var(--text);line-height:1}
.day-name{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-tertiary);letter-spacing:.05em;margin-top:1px}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:3px}
.event-chip{border-radius:7px;padding:4px 6px;margin-bottom:3px;font-size:11px;font-weight:700;line-height:1.3;cursor:pointer;display:flex;align-items:flex-start;gap:3px;position:relative}
.chip-olle{background:var(--col-olle);color:var(--green-dark);border:1px solid var(--col-olle-border)}
.chip-alvar{background:var(--col-alvar);color:#1E3A8A;border:1px solid var(--col-alvar-border)}
.chip-nils{background:var(--col-nils);color:#92400E;border:1px solid var(--col-nils-border)}
.chip-pappa{background:var(--col-pappa);color:#4C1D95;border:1px solid var(--col-pappa-border)}
.chip-ovrigt{background:var(--col-ovrigt);color:#78350F;border:1px solid var(--col-ovrigt-border)}
.chip-del{position:absolute;top:2px;right:2px;font-size:10px;cursor:pointer;opacity:.5;line-height:1}
.chip-del:hover{opacity:1}
.chip-time{font-size:9px;font-weight:600;opacity:.7;display:block}
.add-chip{background:transparent;border:1.5px dashed var(--border);color:var(--text-tertiary);border-radius:7px;padding:3px 6px;font-size:11px;font-weight:700;cursor:pointer;width:100%;text-align:left;font-family:'Nunito',sans-serif}
.olle-week{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.olle-day-card{background:var(--card);border-radius:var(--radius);border:1.5px solid var(--border);overflow:hidden}
.olle-day-card.today{border-color:var(--green);border-width:2px}
.olle-day-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.olle-day-card.today .olle-day-header{background:var(--col-olle)}
.olle-day-num{font-size:22px;font-weight:800;color:var(--text);width:32px;text-align:center}
.olle-day-name{font-size:14px;font-weight:700;color:var(--text-secondary)}
.olle-today-badge{background:var(--green);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.olle-events{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.olle-event{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--col-olle);border:1.5px solid var(--col-olle-border);border-radius:var(--radius-sm);cursor:pointer}
.olle-event-icon{font-size:22px;flex-shrink:0}
.olle-event-name{font-size:15px;font-weight:700;color:var(--green-dark)}
.olle-event-time{font-size:12px;font-weight:600;color:#0F6E56;margin-top:1px}
.olle-speak{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--col-olle-border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.olle-empty{padding:10px 14px;font-size:13px;color:var(--text-tertiary);font-weight:600}
.olle-fam-row{display:flex;gap:4px;padding:6px 14px 10px;flex-wrap:wrap}
.fam-chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.legend{display:none!important}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:16px}
.field-label{font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:5px;margin-top:12px;text-transform:uppercase;letter-spacing:.05em}
.field-label:first-of-type{margin-top:0}
.sym-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:4px}
.sp{font-size:22px;padding:5px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;text-align:center}
.sp.sel{border-color:var(--green);background:var(--green-light)}
input,select{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:15px;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--green)}
.person-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.person-btn{padding:10px 10px 10px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;text-align:left;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:4px}
.person-btn.sel-olle{background:var(--col-olle);border-color:var(--col-olle-border);color:var(--green-dark)}
.person-btn.sel-alvar{background:var(--col-alvar);border-color:var(--col-alvar-border);color:#1E3A8A}
.person-btn.sel-nils{background:var(--col-nils);border-color:var(--col-nils-border);color:#92400E}
.person-btn.sel-pappa{background:var(--col-pappa);border-color:var(--col-pappa-border);color:#4C1D95}
.person-btn.sel-ovrigt{background:var(--col-ovrigt);border-color:var(--col-ovrigt-border);color:#78350F}
.person-check{font-size:14px;flex-shrink:0}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-save{flex:1;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px;font-size:16px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer}
.btn-cancel{flex:1;background:var(--bg);color:var(--text-secondary);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:15px;font-family:'Nunito',sans-serif;cursor:pointer}
.gcal-event-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;margin-bottom:4px}
.gcal-event-row{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--bg);border-radius:var(--radius-sm);border:1.5px solid var(--border);cursor:pointer;transition:border-color .15s}
.gcal-event-row.sel{border-color:#3B82F6;background:#EEF4FF}
.gcal-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.gcal-event-row.sel .gcal-check{background:#3B82F6;border-color:#3B82F6;color:#fff}
.gcal-info{flex:1}
.gcal-title{font-size:14px;font-weight:700;color:var(--text)}
.gcal-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
.gcal-person-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gcal-pb{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s}
.gcal-pb.sel-olle{background:var(--col-olle);border-color:var(--col-olle-border);color:var(--green-dark)}
.gcal-pb.sel-alvar{background:var(--col-alvar);border-color:var(--col-alvar-border);color:#1E3A8A}
.gcal-pb.sel-nils{background:var(--col-nils);border-color:var(--col-nils-border);color:#92400E}
.gcal-pb.sel-pappa{background:var(--col-pappa);border-color:var(--col-pappa-border);color:#4C1D95}
.gcal-pb.sel-ovrigt{background:var(--col-ovrigt);border-color:var(--col-ovrigt-border);color:#78350F}
.gcal-empty{padding:24px;text-align:center;font-size:14px;color:var(--text-tertiary);font-weight:600;line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:14px;font-weight:700;padding:10px 22px;border-radius:30px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:300;font-family:'Nunito',sans-serif}
.toast.show{opacity:1}

.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:4px}
.day-btn{padding:8px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-weight:700;cursor:pointer;font-family:"Nunito",sans-serif;text-align:center;transition:all .15s}
.day-btn.sel{background:var(--green);border-color:var(--green);color:#fff}
.day-btn.today-day{border-color:var(--green)}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div><div class="topbar-title">Veckoplanen 📅</div><div class="topbar-week" id="week-label">v.23</div></div>
  <div class="topbar-right">
    <div class="icon-btn gcal" id="gcal-btn" onclick="handleGcalBtn()" title="Hämta från Google Kalender">📅</div>
    <div class="icon-btn" id="sync-btn" onclick="loadWeek()" title="Uppdatera">🔄</div>
    <div class="icon-btn" onclick="openAddModal(null,null)" title="Lägg till">➕</div>
    <div class="icon-btn green" onclick="window.location.href='index.html'" title="Olles dag">🏠</div>
  </div>
</div>
<div class="view-toggle">
  <button class="vt-btn on" id="vt-fam" onclick="setView('family')">👨‍👩‍👧 Familjen</button>
  <button class="vt-btn" id="vt-olle" onclick="setView('olle')">⭐ Olles vecka</button>
</div>
<div class="week-nav">
  <div class="week-nav-btn" onclick="shiftWeek(-1)">←</div>
  <div class="week-nav-label" id="week-nav-label">1–7 juni</div>
  <div class="week-nav-btn" onclick="shiftWeek(1)">→</div>
</div>
<div class="legend" id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1D9E75"></div>Olle</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3B82F6"></div>Alvar</div>
  <div class="legend-item"><div class="legend-dot" style="background:#F97316"></div>Nils</div>
  <div class="legend-item"><div class="legend-dot" style="background:#A855F7"></div>Pappa & Lina</div>
  <div class="legend-item"><div class="legend-dot" style="background:#EAB308"></div>Övrigt</div>
</div>
<div class="scroll-body" id="scroll-body">
  <div class="cal-wrap" id="cal-wrap"><table class="cal-table" id="cal-table"></table></div>
</div>
</div>

<!-- Lägg till modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Ny händelse</div>
    <div class="field-label">Symbol</div><div class="sym-grid" id="sym-grid"></div>
    <div class="field-label">Namn</div><input id="ev-name" type="text" placeholder="T.ex. Läkaren">
    <div class="field-label">Tid (valfri)</div><input id="ev-time" type="time" step="300">
    <div class="field-label">Dag (valj en eller flera)</div><div class="day-grid" id="day-grid"></div>
    <div class="field-label" style="display:none">Vem gäller det? (välj en eller flera)</div>
    <div class="person-grid" id="person-grid" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
      <button class="btn-save" onclick="saveEvent()">Spara</button>
    </div>
  </div>
</div>

<!-- Google Calendar modal -->
<div class="modal-bg" id="gcal-modal-bg">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📅 Hämta från Google Kalender</div>
    <div id="gcal-body"><div class="gcal-empty">🔄 Laddar händelser...</div></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeGcalModal()">Avbryt</button>
      <button class="btn-save" id="gcal-import-btn" onclick="importGcalEvents()">Importera valda</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="veckoplan.js"></script>
</body>
</html>
